name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "ci-setup", "actualizacion" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # SESIÓN 1: Integración Continua (Tests)
  # ==========================================
  test:
    name: 1. Pruebas Automatizadas (CI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_ecommerce_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Evitar conflicto de puertos con el postgresql por defecto de Ubuntu Runner
      - name: Detener PostgreSQL local del runner
        run: sudo systemctl stop postgresql || true

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias (python manage.py test)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/test_ecommerce_db
          DB_NAME: test_ecommerce_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECRET_KEY: django-insecure-ci-test-key
          DEBUG: "True"
        run: |
          python manage.py test

  # ==========================================
  # SESIÓN 2 & 3: Construcción Docker y Artefacto (CD)
  # ==========================================
  build-and-package:
    name: 2. Construcción Docker y Artefacto
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker de Django
        run: |
          echo "=== Construyendo imagen basada en Python 3.10 ==="
          docker build -t django-ecommerce:latest -t django-ecommerce:${{ github.sha }} .

      - name: Empaquetar imagen Docker como Artefacto comprimido
        run: |
          echo "=== Exportando imagen Docker para preservación de Artefactos ==="
          docker save django-ecommerce:latest | gzip > django-ecommerce-image.tar.gz
          ls -lh django-ecommerce-image.tar.gz

      - name: Guardar Artefacto en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: django-docker-image
          path: django-ecommerce-image.tar.gz
          retention-days: 7

  # ==========================================
  # SESIÓN 3: Simulación de Despliegue Continuo
  # ==========================================
  simulate-deploy:
    name: 3. Simulación de Despliegue Continuo
    needs: build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar entorno con Docker Compose
        run: |
          echo "=== Inicializando contenedores en entorno de simulación ==="
          docker compose up -d
          echo "Esperando inicialización y migraciones automáticas..."
          sleep 12

      - name: Verificar estado de contenedores y servicios
        run: |
          docker compose ps
          docker ps

      - name: Validar respuesta HTTP del sistema (Smoke Test)
        run: |
          echo "=== Realizando verificación HTTP local (puerto 8000) ==="
          curl -f -I http://localhost:8000/ || curl -I http://localhost:8000/
          echo "=== Verificación de respuesta HTML principal ==="
          curl -s http://localhost:8000/ | grep -i "<title>" || true

      - name: Detener y limpiar entorno de despliegue simulado
        if: always()
        run: |
          docker compose down -v
