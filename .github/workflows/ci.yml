name: Django CI

# Se ejecuta en cada push o pull request a las ramas principales
on:
  push:
    branches: [ "main", "master", "ci-setup" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Servicio de PostgreSQL en GitHub Actions para que los tests corran en base de datos real
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_ecommerce_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configura el entorno Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # 3. Instalar dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar los tests unitarios con las credenciales de PostgreSQL
      - name: Ejecutar pruebas (tests)
        env:
          DB_NAME: test_ecommerce_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: django-insecure-ci-test-key
          DEBUG: "True"
        run: |
          python manage.py test
